<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الإنيغرام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
        .answer-btn { 
            display: block; width: 100%; text-align: right; padding: 1rem; 
            margin-bottom: 0.8rem; border: 2px solid #e2e8f0; border-radius: 1rem;
            transition: all 0.2s ease; background: white; cursor: pointer;
        }
        .answer-btn:hover { border-color: #3b82f6; background-color: #eff6ff; transform: scale(0.99); }
        .example-text { color: #64748b; font-size: 0.85rem; margin-top: 0.3rem; line-height: 1.4; display: block; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-2xl mx-auto">
         <header class="flex justify-between items-center mb-10 px-2">
    <div class="text-right">
        <h1 class="text-3xl font-bold text-slate-800">منصة تحليل الشخصية</h1>
        <p class="text-slate-500 mt-2 italic">اجب بناءً على ما يمثلك فعلياً</p>
    </div>
    <!-- قائمة التحكم المحدثة برابط العودة -->
    <div class="flex flex-col gap-2 items-start">
        <a href="../index.html" class="text-sm font-bold text-slate-400 hover:text-slate-600 transition-colors">🏠 القائمة الرئيسية</a>
        <button onclick="showHistory()" class="text-sm font-bold text-blue-600 hover:underline">📊 سجل النتائج</button>
        <button onclick="resetTest()" class="text-sm font-bold text-red-400 hover:underline">🔄 إعادة البدء</button>
    </div>
</header>

        <div id="quiz-card" class="bg-white shadow-2xl rounded-3xl p-6 md:p-10">
            <div id="quiz-view">
                <div class="flex justify-between items-center mb-4">
                    <span id="progress-text" class="text-blue-600 font-bold"></span>
                </div>
                <div class="w-full bg-slate-100 h-3 rounded-full mb-8">
                    <div id="progress-bar" class="bg-blue-600 h-full rounded-full transition-all duration-700" style="width: 0%"></div>
                </div>

                <h2 id="question-text" class="text-2xl font-bold text-slate-700 mb-10 leading-snug">جاري التحميل...</h2>
                
                <div id="options-container"></div>
                <div id="status-msg" class="mt-6 text-center text-blue-600 font-bold hidden">تم تسجيل الإجابة.. التالي</div>
            </div>

            <!-- واجهة السجل (تظهر عند الطلب) -->
            <div id="history-view" class="hidden">
                <h2 class="text-2xl font-bold mb-6 text-slate-800 border-b pb-4">النتائج السابقة</h2>
                <div id="history-list" class="space-y-4 mb-8"></div>
                <button onclick="closeHistory()" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold">العودة للاختبار</button>
            </div>
        </div>
    </div>

<script src="enneagram_questions.js"></script> 

    <script>
        let currentIndex = 0;
let scores = [];

        // 1. تحميل التقدم المحرز
        function init() {
            const saved = localStorage.getItem('enneagram_progress');
            if (saved) {
                const data = JSON.parse(saved);
                currentIndex = data.idx;
                scores = data.scores;
                if (currentIndex >= enneagramQuestions.length) {
                    showResults();
                    return;
                }
            }
            render();
        }

      function render() {
    if (typeof enneagramQuestions === 'undefined') {
        document.getElementById('question-text').innerText = "خطأ: لم يتم تحميل الأسئلة";
        return;
    }

    const q = enneagramQuestions[currentIndex];
    document.getElementById('progress-text').innerText = `السؤال ${currentIndex + 1} من ${enneagramQuestions.length}`;
    document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / enneagramQuestions.length) * 100}%`;
    document.getElementById('question-text').innerText = q.q;
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        
        // الحل الجمالي للـ undefined الذي طلبته
        const hintText = opt.example ? opt.example : "يعبر عن دوافعي العميقة";
        
        btn.innerHTML = `
            <div class="font-bold text-slate-800 text-base md:text-lg">${opt.text}</div>
            <div class="example-text" style="color: #10b981;">✨ ${hintText}</div>
        `;

        // دالة النقر (المسؤولة عن التقدم)
        btn.onclick = () => {
            // 1. تسجيل النتيجة
            scores.push(opt.score); 
            
            // 2. زيادة العداد وحفظ التقدم
            currentIndex++;
            localStorage.setItem('enneagram_progress', JSON.stringify({idx: currentIndex, scores: scores}));
            
            // 3. إظهار رسالة الحالة
            document.getElementById('status-msg').classList.remove('hidden');
            
            // 4. الانتقال للسؤال التالي بعد وقت قصير
            setTimeout(() => {
                document.getElementById('status-msg').classList.add('hidden');
                
                if(currentIndex < enneagramQuestions.length) {
                    render(); // استدعاء الدالة لنفسها لعرض السؤال التالي
                    window.scrollTo(0, 0); // العودة لأعلى الصفحة
                } else {
                    showResults(); // عرض النتيجة النهائية
                }
            }, 400);
        };
        container.appendChild(btn);
    });
}

     function showResults() {
    // حساب التكرارات لكل نمط
    const counts = {};
    let maxCount = 0;
    let mainType = 0;

    scores.forEach(num => {
        counts[num] = (counts[num] || 0) + 1;
        if (counts[num] > maxCount) {
            maxCount = counts[num];
            mainType = num;
        }
    });

    const typeNames = {
        1: "المصلح (Reformer)", 2: "المساعد (Helper)", 3: "المنجز (Achiever)",
        4: "المتفرد (Individualist)", 5: "الباحث (Investigator)", 6: "المخلص (Loyalist)",
        7: "المتحمس (Enthusiast)", 8: "المتحدي (Challenger)", 9: "صانع السلام (Peacemaker)"
    };

    const finalType = typeNames[mainType] || "غير محدد";

    let html = `
        <div class="text-center py-5">
            <h2 class="text-2xl font-bold mb-4 text-slate-800">نتيجة اختبار الإنيغرام</h2>
            <div class="text-4xl font-black text-emerald-600 mb-6 uppercase tracking-wider">${finalType}</div>
            <p class="text-slate-500 mb-10 italic">النمط رقم (${mainType}) هو النمط الأكثر تعبيراً عن دوافعك حالياً.</p>
            
            <div class="flex flex-col gap-4">
                <button onclick="copyEnneagram('${finalType}')" class="w-full py-4 bg-emerald-50 text-emerald-600 rounded-2xl font-bold border-2 border-emerald-200">📋 نسخ النمط</button>
                <button onclick="resetTest()" class="w-full py-4 bg-slate-100 text-slate-500 rounded-2xl font-bold">🔄 إعادة الاختبار</button>
            </div>
        </div>`;
    
    // حفظ النتيجة في سجل الإنيغرام
    saveHistoryEntry({ type: finalType, number: mainType });
    
    document.getElementById('quiz-card').innerHTML = html;
}

  function saveHistoryEntry(res) {
    let history = JSON.parse(localStorage.getItem('enneagram_history') || '[]');
    history.unshift({ 
        date: new Date().toLocaleString('ar-EG'), 
        result: res.type,
        num: res.number
    });
    localStorage.setItem('enneagram_history', JSON.stringify(history.slice(0, 10)));
}

       // 2. دالة عرض السجل المحدثة
function showHistory() {
    document.getElementById('quiz-view').classList.add('hidden');
    document.getElementById('history-view').classList.remove('hidden');
    const history = JSON.parse(localStorage.getItem('enneagram_history') || '[]');
    const list = document.getElementById('history-list');
    
    list.innerHTML = history.length ? history.map(item => `
        <div class="p-4 border rounded-2xl bg-slate-50 mb-3 text-right">
            <div class="text-xs font-bold text-slate-400 mb-1">${item.date}</div>
            <div class="text-lg font-bold text-emerald-600">${item.result}</div>
            <div class="text-[10px] text-slate-500 italic">النمط الرقمي: ${item.num}</div>
        </div>
    `).join('') : "<p class='text-center text-slate-400'>لا توجد نتائج مسجلة.</p>";
}

        function closeHistory() {
            document.getElementById('history-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
        }

        // 3. دالة نسخ النتائج المحدثة
function copyEnneagram(type) {
    const text = `نمطي في اختبار الإنيغرام هو: ${type}\nاكتشف نمطك عبر منصة الاختبارات الشاملة.`;
    navigator.clipboard.writeText(text).then(() => alert("تم نسخ النتيجة!"));
}
        

       // 4. دالة إعادة الاختبار
function resetTest() {
    if(confirm("هل تريد إعادة اختبار الإنيغرام من البداية؟")) {
        localStorage.removeItem('enneagram_progress');
        location.reload();
    }
}

function translate(t) {
    const labels = { "EI": "الانبساط (E) vs الانطواء (I)", "SN": "الحس (S) vs الحدس (N)", "TF": "التفكير (T) vs الشعور (F)", "JP": "الحزم (J) vs المرونة (P)" };
    return labels[t] || t;
}
        window.onload = init;

    </script>
</body>
</html>
