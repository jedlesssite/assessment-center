<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تدريب التفكير العددي</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; overflow-x: hidden; }
        
        /* البطاقة الرئيسية */
        .app-card { width: 100%; max-width: 500px; margin: 0 auto; }

        /* النمط الموحد للأزرار (زوايا 4px) */
        .ui-btn {
            border-radius: 4px !important; /* دوران 4px كما طلبت */
            border: 1px solid #e2e8f0;
            background: white;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .ui-btn:hover {
            border-color: #3b82f6;
            color: #3b82f6;
            background-color: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* أزرار الإجابات */
        .answer-btn { 
            display: block; width: 100%; text-align: center; padding: 1.1rem; 
            margin-bottom: 0.7rem; border: 2px solid #e2e8f0; border-radius: 4px;
            transition: all 0.2s ease; background: white; cursor: pointer;
            font-weight: 700; color: #334155; font-size: 0.95rem;
        }
        .answer-btn:hover:not(:disabled) { border-color: #3b82f6; background-color: #eff6ff; }
        
        .correct { border-color: #10b981 !important; background-color: #ecfdf5 !important; color: #065f46 !important; }
        .wrong { border-color: #ef4444 !important; background-color: #fef2f2 !important; color: #991b1b !important; }

        /* زر السؤال التالي المطور */
        .action-btn {
            background: #2563eb;
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 0px #1e40af;
            border: none;
        }
        .action-btn:hover {
            background: #1d4ed8;
            transform: translateY(2px);
            box-shadow: 0 2px 0px #1e40af;
        }

        /* حاوية الرسم البياني */
        .visual-frame {
    width: 100%; 
    background: #ffffff; 
    border-radius: 4px; /* تم التعديل لـ 4px ليتناسق مع بقية الأزرار */
    margin-bottom: 1.5rem; 
    border: 1px solid #e2e8f0;
    display: flex; 
    justify-content: center; 
    align-items: center;
    padding: 20px; 
    min-height: 240px;
    overflow: hidden; /* يمنع خروج أي نص أو رسم خارج حدود الصندوق */
}

.visual-frame svg { 
    max-width: 100%; 
    height: auto; 
    display: block; 
    margin: 0 auto; 
}
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="app-card">
        <!-- شريط التحكم العلوي (الأزرار على اليسار) -->
        <div class="flex justify-end items-center mb-8 gap-2">
            <button onclick="location.href='../index.html'" class="ui-btn">🏠 الرئيسية</button>
            <button onclick="showHistory()" class="ui-btn">📊 السجل</button>
            <button onclick="resetTest()" class="ui-btn" style="color: #f87171;">🔄 إعادة</button>
        </div>

        <header class="text-center mb-8">
            <h1 class="text-xl font-black text-slate-800 tracking-tight">التفكير العددي</h1>
            <p class="text-slate-400 text-[10px] mt-1 uppercase tracking-[0.2em] font-bold italic">التدريب التحليلي</p>
        </header>

        <div id="quiz-card" class="bg-white shadow-xl rounded-lg p-6 md:p-10 border border-slate-200">
            <div id="quiz-view">
    <!-- عداد الأسئلة الرقمي -->
    <div class="flex justify-between items-center mb-2">
        <span id="progress-text" class="text-blue-600 font-black text-[11px] uppercase tracking-tighter">
            جاري حساب التقدم...
        </span>
        <span class="text-slate-300 text-[10px] font-bold">NUMERICAL</span>
    </div>
                <!-- شريط التقدم -->
              <div style="width: 100%; background-color: #e2e8f0; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 2rem; border: 1px solid #cbd5e1;">
        <div id="progress-bar" style="width: 0%; height: 100%; background-color: #2563eb; transition: width 0.6s ease-in-out;"></div>
    </div>

                <!-- مساحة الرسم البياني -->
                <div id="visual-area" class="visual-frame shadow-inner"></div>

                <h2 id="question-text" class="text-lg font-bold text-slate-700 mb-8 leading-relaxed text-center px-2"></h2>
                
                <!-- خيارات الإجابة -->
                <div id="options-container" class="grid grid-cols-1 gap-2"></div>

                <!-- صندوق الشرح المطور -->
                <div id="explanation-box" class="mt-8 p-6 bg-slate-50 border-t-2 border-blue-500 rounded-b-lg hidden">
                    <div class="flex items-center gap-2 mb-3 justify-center">
                        <span class="text-blue-600 text-lg font-black italic">METHOD</span>
                    </div>
                    <p id="explanation-text" class="text-slate-600 text-xs leading-relaxed mb-6 text-center font-medium"></p>
                    <button onclick="nextQuestion()" class="action-btn">
                        استمرار للسؤال التالي ➜
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="numerical_questions.js"></script>
    <script>
        let currentIndex = 0;
        let score = 0;

     function render() {
    if (typeof numericalQuestions === 'undefined' || numericalQuestions.length === 0) return;

    const q = numericalQuestions[currentIndex];
    const total = numericalQuestions.length;

    // 1. تحديث النص
    document.getElementById('progress-text').innerText = `المسألة ${currentIndex + 1} من ${total}`;

    // 2. تحديث الشريط البصري
    const progressBar = document.getElementById('progress-bar');
    const percent = ((currentIndex + 1) / total) * 100;
    
    // سطر برمجي قوي لتغيير العرض فوراً
    progressBar.style.width = percent + "%";

    // 3. عرض البيانات
    document.getElementById('visual-area').innerHTML = q.visual;
    document.getElementById('question-text').innerText = q.q;
    document.getElementById('explanation-box').classList.add('hidden');

    // 4. بناء الخيارات
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerText = opt.text;
        btn.onclick = () => handleCheck(index, q.correctIndex);
        container.appendChild(btn);
    });
}

        function handleCheck(selectedIndex, correctIndex) {
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                btns[selectedIndex].classList.add('correct');
                score++;
            } else {
                btns[selectedIndex].classList.add('wrong');
                btns[correctIndex].classList.add('correct');
            }

            document.getElementById('explanation-text').innerText = numericalQuestions[currentIndex].explanation;
            document.getElementById('explanation-box').classList.remove('hidden');
            
            // سحب الشاشة للأسفل بسلاسة
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < numericalQuestions.length) render(); else showResults();
        }

        // 1. دالة عرض النتائج النهائية (محدثة لتشمل الحفظ والسجل)
function showResults() {
    const total = numericalQuestions.length;
    const p = Math.round((score / total) * 100);

    // استدعاء دالة الحفظ فوراً
    saveNumericalHistory(score, total, p);

    document.getElementById('quiz-card').innerHTML = `
        <div class="text-center py-10">
            <h2 class="text-slate-400 font-black text-xs uppercase mb-2 tracking-widest">Training Complete</h2>
            <div class="text-7xl font-black text-blue-600 mb-2 italic">${p}%</div>
            <p class="text-slate-500 text-xs font-bold mb-8">أجبت على ${score} من أصل ${total} مسائل</p>
            
            <div class="flex flex-col gap-3">
                <button onclick="location.reload()" class="action-btn">إعادة التدريب من جديد</button>
                <button onclick="showHistory()" class="ui-btn w-full py-4 justify-center" style="border-color:#3b82f6; color:#3b82f6;">📊 عرض سجل نتائجك</button>
                <button onclick="location.href='../index.html'" class="ui-btn w-full py-4 justify-center">العودة للقائمة الرئيسية</button>
            </div>
        </div>`;
}

// 2. دالة عرض السجل (المحرك الفعلي لعرض النتائج السابقة)
function showHistory() {
    const history = JSON.parse(localStorage.getItem('numerical_history') || '[]');
    let listHTML = `
        <div class="text-right">
            <h2 class="text-xl font-black mb-6 border-b-2 border-slate-100 pb-2 text-slate-800 italic text-center">سجل الأداء العددي:</h2>
            <div class="space-y-3">`;

    listHTML += history.length ? history.map(item => {
        let color = item.percent >= 80 ? 'text-emerald-500' : (item.percent >= 50 ? 'text-blue-500' : 'text-red-500');
        return `
            <div class="p-4 border border-slate-100 rounded-[4px] bg-slate-50 flex justify-between items-center shadow-sm">
                <div>
                    <div class="text-[9px] text-slate-400 font-bold mb-1">${item.date}</div>
                    <div class="text-[11px] font-black text-slate-600">النتيجة: ${item.res}</div>
                </div>
                <div class="text-xl font-black ${color}">${item.percent}%</div>
            </div>`;
    }).join('') : "<p class='text-center text-slate-400 py-10 font-bold'>لا توجد نتائج مسجلة حتى الآن.</p>";

    listHTML += `
            </div>
            <button onclick="location.reload()" class="action-btn mt-8">↩ العودة للاختبار</button>
        </div>`;
    
    document.getElementById('quiz-card').innerHTML = listHTML;
}

// 3. دالة إعادة البدء المصلحة
function resetTest() {
    if(confirm("سيتم تصفير التقدم الحالي، هل أنت متأكد؟")) {
        location.reload();
    }
}

// 4. دالة الحفظ في الذاكرة (لا تنساها!)
function saveNumericalHistory(correct, total, percent) {
    let history = JSON.parse(localStorage.getItem('numerical_history') || '[]');
    history.unshift({
        date: new Date().toLocaleString('ar-EG'),
        res: `${correct} من ${total}`,
        percent: percent
    });
    localStorage.setItem('numerical_history', JSON.stringify(history.slice(0, 10)));
}

window.onload = render;
    </script>
</body>
</html>
